name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTEST_ADDOPTS: --basetemp=/mlet-pytest/run
      TMPDIR: /mlet-pytest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install manuscript verification tools
        env:
          TECTONIC_ARCHIVE_SHA256: 1a715688baf591e650c8aeb160ae934e181685eecbb38b317de30b269ac5d606
          TECTONIC_ARCHIVE_URL: https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          tectonic_archive="$RUNNER_TEMP/tectonic.tar.gz"
          curl --fail --location --silent --show-error "$TECTONIC_ARCHIVE_URL" --output "$tectonic_archive"
          echo "$TECTONIC_ARCHIVE_SHA256  $tectonic_archive" | sha256sum --check
          tar --extract --gzip --file "$tectonic_archive" --directory "$RUNNER_TEMP"
          sudo install --mode 0755 "$RUNNER_TEMP/tectonic" /usr/local/bin/tectonic
          pdfinfo -v
          pdftoppm -v
          tectonic --version
      - name: Provision trusted pytest scratch root
        run: sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /mlet-pytest
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Verify
        run: ./scripts/verify.sh

  test-hybrid:
    runs-on: ubuntu-latest
    env:
      PYTEST_ADDOPTS: --basetemp=/mlet-pytest/run
      TMPDIR: /mlet-pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install manuscript verification tools
        env:
          TECTONIC_ARCHIVE_SHA256: 1a715688baf591e650c8aeb160ae934e181685eecbb38b317de30b269ac5d606
          TECTONIC_ARCHIVE_URL: https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          tectonic_archive="$RUNNER_TEMP/tectonic.tar.gz"
          curl --fail --location --silent --show-error "$TECTONIC_ARCHIVE_URL" --output "$tectonic_archive"
          echo "$TECTONIC_ARCHIVE_SHA256  $tectonic_archive" | sha256sum --check
          tar --extract --gzip --file "$tectonic_archive" --directory "$RUNNER_TEMP"
          sudo install --mode 0755 "$RUNNER_TEMP/tectonic" /usr/local/bin/tectonic
          pdfinfo -v
          pdftoppm -v
          tectonic --version
      - name: Provision trusted pytest scratch root
        run: sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /mlet-pytest
      - name: Install package with the hybrid extra
        run: python -m pip install -e ".[hybrid,test]"
      - name: Run the hybrid tests
        run: |
          python -m pytest tests/test_hybrid_bounded.py \
                           tests/test_hybrid_fao56_dual.py \
                           tests/test_hybrid_torch_adapter.py \
                           tests/test_hybrid_isolation.py -v
      - name: Confirm the serving path still does not reach torch
        run: ./scripts/verify.sh
